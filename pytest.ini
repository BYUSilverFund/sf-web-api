[pytest]
# Pytest configuration for Silver Fund API tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=app --cov-report=term-missing --cov-report=html --strict-markers
markers =
    unit: Unit tests for models and functions
    service: Service layer tests
    route: Route/endpoint tests
    auth: Authentication and CORS tests
    integration: Integration and workflow tests

# Ignore __pycache__ and .venv
norecursedirs = .venv __pycache__ .pytest_cache

# Timezone for testing
asyncio_mode = auto
