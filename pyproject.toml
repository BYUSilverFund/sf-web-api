[project]
name = "silver-fund-api"
version = "0.1.0"
description = "Web API for Silver Fund dashboard"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "BYU Silver Fund", email = "admin@byu.edu" }
]
license = { text = "MIT" }
keywords = ["fastapi", "finance", "portfolio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi==0.121.3",
    "uvicorn==0.38.0",
    "python-dotenv==1.2.1",
    "python-jose==3.3.0",
    "pydantic==2.12.4",
    "sqlalchemy==2.0.44",
    "psycopg2-binary==2.9.11",
    "psycopg2==2.9.11",
    "boto3==1.41.2",
    "polars==1.35.2",
    "polars-ols==0.3.5",
    "pandas==2.3.3",
    "numpy==2.3.5",
    "scipy==1.16.3",
    "statsmodels==0.14.5",
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.4",
    "pre-commit==4.4.0",
    "pytest==7.4.4",
    "pytest-cov==4.1.0",
    "pytest-asyncio==0.23.3",
    "httpx==0.26.0",
    "pytest-mock==3.12.0",
    "faker==22.2.0",
    "hypothesis==6.92.1",
]

[project.urls]
Repository = "https://github.com/BYUSilverFund/sf-web-api"
Issues = "https://github.com/BYUSilverFund/sf-web-api/issues"

# Ruff configuration - all-in-one linting and formatting
[tool.ruff]
target-version = "py313"
line-length = 88

# Exclude directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`)
select = ["E", "F", "I"]
# Ignore line length - let formatter handle it
ignore = ["E501"]

# Allow fix for all enabled rules (when `--fix` is provided)
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
# Import spacing - compatible with formatter
lines-after-imports = 2
lines-between-types = 0
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
